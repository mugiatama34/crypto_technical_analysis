name: backtest

# Elle: OKX geçmişinden walk-forward backtest; rapor docs/backtest/results.json'a commit edilir (backtest.html okur).
on:
  schedule:
    - cron: "0 6 * * 0" # Pazar 06:00 UTC: araştırmacı ajan (mode=research)
  workflow_dispatch:
    inputs:
      months: { description: "Kaç ay geriye", default: "6" }
      top: { description: "Hacme göre ilk N coin", default: "50" }
      tfs: { description: "Zaman dilimleri", default: "15m,1H,4H" }
      fee: { description: "Komisyon % / taraf", default: "0.05" }
      slip: { description: "Kayma %", default: "0.05" }
      claude_sample: { description: "Claude örneklemi (0 = yok)", default: "0" }
      universe: { description: "Lab: dönem evreni havuzu (ör. 150; 0 = kapalı, bugünün ilk N'i)", default: "0" }
      strategies: { description: "Lab: yalnız bu aileler (virgülle; boş = hepsi), ör. btc_tsmom_1h,btc_tsmom_4h", default: "" }
      fillbar: { description: "Lab: limit dolum mumunda hedef: count (iyimser, eski) | skip (kötümser)", default: "count" }
      mode: { description: "full: yeniden koşu + tarama · sweep: yalnız tarama (önbellek + son plans.json.gz) · lab: strateji laboratuvarı · research: araştırmacı ajan (kuyruk → tarama → rapor) · replay: canlı sinyalleri gerçek mumlarla yeniden oynat (canlı-backtest eşleştirme) · checklist: 10 maddelik check list ölçümü (son planlar)", default: "full" }

env:
  MODE: ${{ github.event_name == 'schedule' && 'research' || inputs.mode }}
  MONTHS: ${{ inputs.months || '12' }}
  TOP: ${{ inputs.top || '50' }}
  TFS: ${{ inputs.tfs || '1H,4H' }}
  FEE: ${{ inputs.fee || '0.05' }}
  SLIP: ${{ inputs.slip || '0.05' }}

concurrency:
  group: backtest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore candle cache
        uses: actions/cache@v4
        with:
          path: backtest/cache
          key: candles-${{ github.run_id }}
          restore-keys: |
            candles-
      - name: Restore last plans (sweep mode)
        if: ${{ env.MODE == 'sweep' || env.MODE == 'research' || env.MODE == 'checklist' }}
        uses: actions/cache/restore@v4
        with:
          path: docs/backtest/plans.json.gz
          key: plans-${{ github.run_id }}
          restore-keys: |
            plans-
      - name: Strategy lab
        if: ${{ env.MODE == 'lab' }}
        run: node backtest/lab/run.mjs --months ${{ env.MONTHS }} --top ${{ env.TOP }} --universe ${{ inputs.universe || '0' }} --tfs ${{ env.TFS }} --fee ${{ env.FEE }} --slip ${{ env.SLIP }} --fillbar ${{ inputs.fillbar || 'count' }} ${{ inputs.strategies != '' && format('--strategies {0}', inputs.strategies) || '' }}
      - name: Checklist measurement
        if: ${{ env.MODE == 'checklist' }}
        run: node backtest/checklist.mjs
      - name: Live replay
        if: ${{ env.MODE == 'replay' }}
        run: node backtest/replay.mjs
      - name: Recover plans from git history (sweep mode)
        if: ${{ env.MODE == 'sweep' || env.MODE == 'research' || env.MODE == 'checklist' }}
        run: |
          if [ ! -f docs/backtest/plans.json.gz ]; then
            sha=$(git log --all --diff-filter=A --format=%H -- docs/backtest/plans.json.gz | head -1)
            if [ -n "$sha" ]; then git show "$sha:docs/backtest/plans.json.gz" > docs/backtest/plans.json.gz && echo "plans.json.gz $sha commit'inden alındı"; fi
          fi
          test -f docs/backtest/plans.json.gz || { echo "plans.json.gz yok: önce mode=full koş"; exit 1; }
          ls -la docs/backtest/plans.json.gz
      - name: Run backtest
        if: ${{ env.MODE == 'full' }}
        run: node backtest/run.mjs --months ${{ env.MONTHS }} --top ${{ env.TOP }} --tfs ${{ env.TFS }} --fee ${{ env.FEE }} --slip ${{ env.SLIP }}
      - name: Save plans
        if: ${{ hashFiles('docs/backtest/plans.json.gz') != '' }}
        uses: actions/cache/save@v4
        with:
          path: docs/backtest/plans.json.gz
          key: plans-${{ github.run_id }}
      - name: Parameter sweep
        if: ${{ env.MODE == 'full' || env.MODE == 'sweep' }}
        run: node backtest/sweep.mjs
      - name: Research agent
        if: ${{ env.MODE == 'research' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL }}
        run: node bot/research/run.mjs
      - name: Learn scoring model
        if: ${{ env.MODE == 'full' || env.MODE == 'sweep' }}
        run: node backtest/learn.mjs
      - name: Claude sample
        if: ${{ inputs.claude_sample && inputs.claude_sample != '0' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node backtest/brain-sample.mjs --n ${{ inputs.claude_sample }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --cached -q docs/backtest/plans.json.gz 2>/dev/null || true
          for f in docs/backtest/results.json docs/backtest/sweep.json docs/backtest/learn.json docs/backtest/lab.json docs/backtest/claude-sample.json docs/backtest/replay.json docs/backtest/checklist.json src/scan/learned.json docs/agent/research.json docs/agent/research-queue.json docs/agent/research-sweep.json; do [ -f "$f" ] && git add "$f"; done
          # Dal bu arada ilerlemiş olabilir (scan commit'leri): önce uzak ucu al, çalışma ağacındaki sonuçları onun üstüne koy
          git stash -q --include-untracked || true
          git fetch -q origin ${{ github.ref_name }} && git reset -q --hard origin/${{ github.ref_name }}
          git stash pop -q || true
          for f in docs/backtest/results.json docs/backtest/sweep.json docs/backtest/learn.json docs/backtest/lab.json docs/backtest/claude-sample.json docs/backtest/replay.json docs/backtest/checklist.json src/scan/learned.json docs/agent/research.json docs/agent/research-queue.json docs/agent/research-sweep.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "backtest (${{ env.MODE }}): ${{ env.MONTHS }} ay, ilk ${{ env.TOP }}, ${{ env.TFS }} (run ${{ github.run_id }})"
          for i in 1 2 3; do git pull -q --rebase origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }} && break || { git rebase --abort 2>/dev/null || true; sleep 5; }; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-${{ github.run_id }}
          path: docs/backtest/
          retention-days: 30
