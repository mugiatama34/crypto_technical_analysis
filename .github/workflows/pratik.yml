name: pratik-snapshot

# Eğitim pratiği için BTC/ETH mum anlık görüntüsü (docs/pratik/candles.json). Her sabah 06:20 UTC (09:20 TR) + elle.
on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:
    inputs:
      extra:
        description: "Ek coinler (virgülle, ör. ARB,SOL) → docs/pratik/extra/<COIN>.json"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Snapshot
        env:
          EXTRA: ${{ inputs.extra }}
        run: node bot/practice/snapshot.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pratik/candles.json docs/pratik/extra 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "bot: pratik mum anlık görüntüsü (run ${{ github.run_id }})"
          # 3 deneme; hepsi başarısızsa adım KIRMIZI biter (eskiden sleep'in 0 koduyla sessizce başarılı sayılıyordu)
          ok=0; for i in 1 2 3; do if git pull -q --rebase origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }}; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 5; done
          [ "$ok" = 1 ] || { echo "::error::pratik yayını 3 denemede başarısız (kayıt depoya yazılamadı)"; exit 1; }
