name: scan-and-alert

# 15 dakikada bir: OKX taraması → aday planlar → Claude değerlendirmesi → Telegram.
# GitHub cron gecikebilir (dakikalarca); bu normaldir. Durum (gönderilen planlar, takip) actions/cache ile taşınır.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "DRY=1: Telegram/Claude'a gitmeden konsola yaz"
        type: boolean
        default: false
      reset_state:
        description: "Durumu sıfırla (takip + cooldown): sahte/dry kayıtları temizler"
        type: boolean
        default: false
      signal_test:
        description: "Sinyal kanalına tek satırlık bağlantı testi gönder (TELEGRAM_SIGNAL_CHAT_ID)"
        type: boolean
        default: false
      force_audit:
        description: "Denetçi ajanı şimdi çalıştır (AUDIT=1 gerekir)"
        type: boolean
        default: false

concurrency:
  group: scan-and-alert
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            bot/state.json
            bot/agent-state.json
            bot/momentum-state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-

      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SIGNAL_CHAT_ID: ${{ secrets.TELEGRAM_SIGNAL_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACCOUNT_USDT: ${{ secrets.ACCOUNT_USDT }}
          SCAN_TFS: ${{ vars.SCAN_TFS }}
          TOP_N: ${{ vars.TOP_N }}
          FIB_ALERT: ${{ vars.FIB_ALERT }}
          FIB_ALERT_TFS: ${{ vars.FIB_ALERT_TFS }}
          FIB_ALERT_MAX: ${{ vars.FIB_ALERT_MAX }}
          FIB_ALERT_TOP: ${{ vars.FIB_ALERT_TOP }}
          BYBIT_MULT: ${{ vars.BYBIT_MULT }} # Bybit çarpanlı sözleşme düzeltmeleri (JSON; boş = yerleşik liste)
          FIB_ALERT_MIN_SCORE: ${{ vars.FIB_ALERT_MIN_SCORE }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          REQUIRE_MTF: ${{ vars.REQUIRE_MTF }}
          MAX_EVAL: ${{ vars.MAX_EVAL }}
          SEND_WAIT: ${{ vars.SEND_WAIT }}
          SEND_CLAUDE: ${{ vars.SEND_CLAUDE }}
          MIN_RR: ${{ vars.MIN_RR }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          MAX_RISK_PCT: ${{ vars.MAX_RISK_PCT }}
          MAX_ALERTS: ${{ vars.MAX_ALERTS }}
          COOLDOWN_H: ${{ vars.COOLDOWN_H }}
          SUMMARY_HOUR_UTC: ${{ vars.SUMMARY_HOUR_UTC }}
          DRY: ${{ inputs.dry && '1' || '' }}
          RESET_STATE: ${{ inputs.reset_state && '1' || '' }}
          AGENT: ${{ vars.AGENT }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_EVERY_MIN: ${{ vars.AGENT_EVERY_MIN }}
          AGENT_SOURCE: ${{ vars.AGENT_SOURCE }}
          AGENT_RESET: ${{ vars.AGENT_RESET }}
          AGENT_EXIT: ${{ vars.AGENT_EXIT }}
          SIGNAL_CHART: ${{ vars.SIGNAL_CHART }}
          WEEKLY_REPORT: ${{ vars.WEEKLY_REPORT }}
          AGENT_MIN_SCORE: ${{ vars.AGENT_MIN_SCORE }}
          TF_RULES: ${{ vars.TF_RULES }}
          SHORT_RULE: ${{ vars.SHORT_RULE }}
          KNIFE_GUARD: ${{ vars.KNIFE_GUARD }}
          LIMIT_ONLY: ${{ vars.LIMIT_ONLY }}
          SKIP_WEEKEND: ${{ vars.SKIP_WEEKEND }}
          DEDUP_WAITING: ${{ vars.DEDUP_WAITING }}
          DEDUP_PCT: ${{ vars.DEDUP_PCT }}
          TIME_STOP: ${{ vars.TIME_STOP }}
          EARLY_TP: ${{ vars.EARLY_TP }}
          HTF_TREND: ${{ vars.HTF_TREND }}
          AUDIT: ${{ vars.AUDIT }}
          AUDIT_MODEL: ${{ vars.AUDIT_MODEL }}
          FORCE_AUDIT: ${{ inputs.force_audit && '1' || '' }}
          SIGNAL_TEST: ${{ inputs.signal_test && '1' || '' }}
          MOMENTUM: ${{ vars.MOMENTUM }}
          MOMENTUM_VARIANT: ${{ vars.MOMENTUM_VARIANT }}
          MOMENTUM_RANK: ${{ vars.MOMENTUM_RANK }}
          MOMENTUM_HEDGE: ${{ vars.MOMENTUM_HEDGE }}
          MOMENTUM_RESET: ${{ vars.MOMENTUM_RESET }}
          REGIME_DONCHIAN: ${{ vars.REGIME_DONCHIAN }}
          MODEL_MIN_PROB: ${{ vars.MODEL_MIN_PROB }}
          BYBIT_DEMO: ${{ vars.BYBIT_DEMO }} # 1 = 4H planları Bybit DEMO hesabına emir (yalnız api-demo.bybit.com)
          BYBIT_DEMO_RISK: ${{ vars.BYBIT_DEMO_RISK }}
          BYBIT_DEMO_KEY: ${{ secrets.BYBIT_DEMO_KEY }}
          BYBIT_DEMO_SECRET: ${{ secrets.BYBIT_DEMO_SECRET }}
        run: node bot/run.mjs

      - name: Save state
        if: always() && !inputs.dry
        uses: actions/cache/save@v4
        with:
          path: |
            bot/state.json
            bot/agent-state.json
            bot/momentum-state.json
          key: bot-state-${{ github.run_id }}

      - name: Publish agent pages
        if: ${{ !inputs.dry }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agent/*.json docs/signals/history.json 2>/dev/null || true
          git add docs/agent/archive 2>/dev/null || true
          git add docs/signals/demo.json 2>/dev/null || true # Bybit demo kaydı (BYBIT_DEMO=1 iken oluşur; ayrı satır: dosya yoksa diğerleri etkilenmez)
          git diff --cached --quiet && exit 0
          git commit -q -m "bot: ajan/sinyal geçmişi güncellemesi (run ${{ github.run_id }})"
          # 3 deneme; hepsi başarısızsa adım KIRMIZI biter (eskiden sleep'in 0 koduyla sessizce başarılı sayılıyordu)
          ok=0; for i in 1 2 3; do if git pull -q --rebase -X theirs origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }}; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 5; done
          [ "$ok" = 1 ] || { echo "::error::yayın 3 denemede başarısız (kayıt depoya yazılamadı)"; exit 1; }

      - name: Trigger research (auditor flagged urgent; after publish so the queue is on the branch)
        if: ${{ !inputs.dry && hashFiles('bot/research-request.flag') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run backtest.yml --ref ${{ github.ref_name }} -f mode=research && rm -f bot/research-request.flag

      # GitHub'ın kendi zamanlayıcısı bu depoda çoğu tetiklemeyi düşürüyor (17.11: brief.yml'in 04:00 / 05:00 UTC cron'ları hiç
      # çalışmadı); tarama dış zamanlayıcıyla 15 dakikada bir geldiği için sabah özetini buradan tetikleriz. Karar aynı kuraldan
      # (planRun: Berlin 06:00–11:59, o gün gönderilmemiş); brief.yml kendi çift gönderim korumasını ayrıca uygular.
      - name: Trigger market brief (morning window, not sent yet)
        if: ${{ !inputs.dry && vars.MARKET_BRIEF == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if node -e "import('./bot/brief/schedule.js').then((m)=>{let s={};try{s=JSON.parse(require('fs').readFileSync('docs/brief/state.json','utf8'))}catch{};const p=m.planRun({nowMs:Date.now(),state:s,flag:true});console.log(p.reason);process.exit(p.daily||p.weekly?0:1)})"; then
            gh workflow run brief.yml --ref ${{ github.ref_name }}
          fi
