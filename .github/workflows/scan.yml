name: scan-and-alert

# 15 dakikada bir: OKX taraması → aday planlar → Claude değerlendirmesi → Telegram.
# GitHub cron gecikebilir (dakikalarca); bu normaldir. Durum (gönderilen planlar, takip) actions/cache ile taşınır.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "DRY=1: Telegram/Claude'a gitmeden konsola yaz"
        type: boolean
        default: false
      reset_state:
        description: "Durumu sıfırla (takip + cooldown): sahte/dry kayıtları temizler"
        type: boolean
        default: false
      force_audit:
        description: "Denetçi ajanı şimdi çalıştır (AUDIT=1 gerekir)"
        type: boolean
        default: false

concurrency:
  group: scan-and-alert
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            bot/state.json
            bot/agent-state.json
            bot/momentum-state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-

      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACCOUNT_USDT: ${{ secrets.ACCOUNT_USDT }}
          SCAN_TFS: ${{ vars.SCAN_TFS }}
          TOP_N: ${{ vars.TOP_N }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          REQUIRE_MTF: ${{ vars.REQUIRE_MTF }}
          MAX_EVAL: ${{ vars.MAX_EVAL }}
          SEND_WAIT: ${{ vars.SEND_WAIT }}
          SEND_CLAUDE: ${{ vars.SEND_CLAUDE }}
          MIN_RR: ${{ vars.MIN_RR }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          MAX_RISK_PCT: ${{ vars.MAX_RISK_PCT }}
          MAX_ALERTS: ${{ vars.MAX_ALERTS }}
          COOLDOWN_H: ${{ vars.COOLDOWN_H }}
          SUMMARY_HOUR_UTC: ${{ vars.SUMMARY_HOUR_UTC }}
          DRY: ${{ inputs.dry && '1' || '' }}
          RESET_STATE: ${{ inputs.reset_state && '1' || '' }}
          AGENT: ${{ vars.AGENT }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_EVERY_MIN: ${{ vars.AGENT_EVERY_MIN }}
          AGENT_MIN_SCORE: ${{ vars.AGENT_MIN_SCORE }}
          TF_RULES: ${{ vars.TF_RULES }}
          SHORT_RULE: ${{ vars.SHORT_RULE }}
          KNIFE_GUARD: ${{ vars.KNIFE_GUARD }}
          LIMIT_ONLY: ${{ vars.LIMIT_ONLY }}
          SKIP_WEEKEND: ${{ vars.SKIP_WEEKEND }}
          TIME_STOP: ${{ vars.TIME_STOP }}
          EARLY_TP: ${{ vars.EARLY_TP }}
          HTF_TREND: ${{ vars.HTF_TREND }}
          AUDIT: ${{ vars.AUDIT }}
          AUDIT_MODEL: ${{ vars.AUDIT_MODEL }}
          FORCE_AUDIT: ${{ inputs.force_audit && '1' || '' }}
          MOMENTUM: ${{ vars.MOMENTUM }}
          MOMENTUM_VARIANT: ${{ vars.MOMENTUM_VARIANT }}
          MOMENTUM_RANK: ${{ vars.MOMENTUM_RANK }}
          MOMENTUM_HEDGE: ${{ vars.MOMENTUM_HEDGE }}
          MODEL_MIN_PROB: ${{ vars.MODEL_MIN_PROB }}
        run: node bot/run.mjs

      - name: Save state
        if: always() && !inputs.dry
        uses: actions/cache/save@v4
        with:
          path: |
            bot/state.json
            bot/agent-state.json
            bot/momentum-state.json
          key: bot-state-${{ github.run_id }}

      - name: Publish agent pages
        if: ${{ !inputs.dry }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agent/*.json docs/signals/history.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "bot: ajan/sinyal geçmişi güncellemesi (run ${{ github.run_id }})"
          for i in 1 2 3; do git pull -q --rebase origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }} && break || sleep 5; done

      - name: Trigger research (auditor flagged urgent; after publish so the queue is on the branch)
        if: ${{ !inputs.dry && hashFiles('bot/research-request.flag') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run backtest.yml --ref ${{ github.ref_name }} -f mode=research && rm -f bot/research-request.flag
